<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo_apk.png" />
    <link rel="apple-touch-icon" href="/logo_apk.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="description" content="Sistema de gestión de alquiler de lavadoras" />
    <link rel="manifest" href="/manifest.json" />
    <title>Lavadoras Global - Sistema de Gestión</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Registrar Service Worker para PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((registration) => {
              console.log('Service Worker registrado exitosamente:', registration.scope);
              
              // Verificar actualizaciones periódicamente
              setInterval(() => {
                registration.update();
              }, 60000); // Cada minuto
              
              // Detectar actualizaciones del service worker
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      // Hay una nueva versión disponible
                      console.log('Nueva versión del Service Worker disponible');
                      // Opcional: mostrar notificación al usuario
                      if (confirm('Hay una nueva versión disponible. ¿Deseas actualizar?')) {
                        window.location.reload();
                      }
                    }
                  });
                }
              });
            })
            .catch((error) => {
              console.error('Error al registrar Service Worker:', error);
            });
        });
      }
    </script>
  </body>
</html>
